plugins {
    id 'java'
    // Versions live in gradle/libs.versions.toml, never in "${...}", so Dependabot can bump them
    // (see the header of that file for why alerts need dependency-submission.yml as well).
    alias(libs.plugins.spring.boot)
    alias(libs.plugins.dependency.management)
    id 'jacoco'
}

group = 'com.firstaidkit'
version = (() -> {
    def versionFile = file("../VERSION")
    if (versionFile.exists()) {
        return versionFile.text.trim()
    }
    return System.getenv("APP_VERSION") ?: "dev"
})()

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-thymeleaf'
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    runtimeOnly 'org.postgresql:postgresql'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation libs.caffeine

    // Rate limiting (bucket4j 8.x moved to the com.bucket4j groupId; jdk17 variant)
    implementation libs.bucket4j.core

    // Resilience4j for circuit breaker and retry (spring-boot4 starter for Spring Boot 4)
    implementation libs.resilience4j.spring.boot4
    implementation libs.resilience4j.retry

    implementation libs.springdoc.openapi

    implementation libs.openpdf

    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // JWT support
    implementation libs.jjwt.api
    runtimeOnly libs.jjwt.impl
    runtimeOnly libs.jjwt.jackson

    implementation libs.mapstruct
    annotationProcessor libs.mapstruct.processor
    implementation libs.lombok.mapstruct.binding
    annotationProcessor libs.lombok.mapstruct.binding

    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
    testImplementation 'org.springframework.boot:spring-boot-resttestclient'

    testImplementation 'org.springframework.boot:spring-boot-webmvc-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'

    // Import Testcontainers BOM (platform) BEFORE declaring testcontainers artifacts
    testImplementation platform(libs.testcontainers.bom)

    testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
    testImplementation 'org.testcontainers:testcontainers-postgresql'
}

tasks.named('test') {
    useJUnitPlatform()
}

test {
    useJUnitPlatform()

    doFirst {
        def agentFile = configurations.testRuntimeClasspath.files.find { it.name.contains('byte-buddy-agent') }
        if (agentFile) {
            jvmArgs = (jvmArgs ?: []) + ["-javaagent:${agentFile.absolutePath}"]
        }
    }

    systemProperty "spring.profiles.active", "test"
    testLogging {
        events "passed", "skipped", "failed"
    }
}

compileJava.options.encoding = 'UTF-8'

jacoco {
    toolVersion = "0.8.16"
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        csv.required = false
        html.outputLocation = layout.buildDirectory.dir('reports/jacoco/test/html')
    }

    jacocoTestCoverageVerification {
        violationRules {
            rule {
                limit {
                    counter = 'LINE'
                    value = 'COVEREDRATIO'
                    // realny poziom z 31.10.2026 (0.54); podnosic razem z nowymi testami
                    minimum = '0.53'.toBigDecimal()
                }
            }
        }
    }
}
